name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with `requires-python` in pyproject.toml.
        python-version: [ '3.11', '3.12', '3.13', '3.14', '3.15' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Smoke-test the CLI
        run: |
          uv run --locked cli2rest-bio --help > /dev/null
          uv run --locked python -c "import importlib.resources; importlib.resources.files('cli2rest_bio.configs')"

  build:
    name: build
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check prerequisite results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A prerequisite job failed."
            exit 1
          fi
